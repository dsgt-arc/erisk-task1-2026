[project]
name = "001-baseline-mvp"
version = "0.1.0"
description = "Baseline MVP for eRisk 2026 Task 1: Conversational Depression Detection"
authors = [
    { name = "Victor Gong", email = "vgong7@gatech.edu" },
]
requires-python = ">=3.10"
dependencies = [
    # LLM APIs
    "openai>=1.0.0",
    "anthropic>=0.20.0",

    # Machine Learning (for mention detection)
    "scikit-learn>=1.3.0",

    # Data handling
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # Utilities
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
